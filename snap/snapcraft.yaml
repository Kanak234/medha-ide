# MEDHA IDE - Snap package definition.
# WHY strict confinement (changed in 2.0.0): classic needs a manual Snap Store review that can
# take weeks. Instead MEDHA now BUNDLES its own compilers, exactly like the Windows MSIX:
#   - GCC/G++ 13 + binutils + glibc headers (Ubuntu 24.04 packages, staged below)
#   - Temurin JDK 25 (same JDK as the Windows build)
#   - Python 3.12 (already the runtime of the IDE itself)
# The strict package must still pass Store review and runtime tests before release.
# HOW gcc works inside the sandbox: snap/local/toolwrap/gcc runs gcc-13 --sysroot=$SNAP, so
# headers and libs come from the snap; glibc itself comes from the core24 base (see the
# `libc-links` part). Limits of strict: files only under your home folder (not hidden dot
# folders) and removable drives; GDB debugging is not available (ptrace is blocked).

name: medha-ide
title: MEDHA IDE
summary: Offline IDE for C, C++, Java, Python and Turbo C graphics.h
description: |
  MEDHA is a native desktop IDE (Python + PySide6/Qt 6) with bundled GCC/G++,
  Eclipse Temurin JDK 25 and Python for offline C, C++, Java and Python programs.
  - Multi-tab editor with syntax highlighting and symbol outline
  - Compile and run with a Problems panel and integrated terminal
  - Turbo C mode: graphics.h/conio.h in a 640x480 panel
  - Beginner error explanations in English and Hinglish
  - Offline security scan, Turbo C modernization and example lab programs
  - Optional local Ollama AI and Open VSX themes/snippets/grammar data
  Network access is needed for extension downloads and the optional AI service.
  This strict snap works with visible files in your home directory. Removable
  drives require connecting the removable-media interface. Host-installed tools
  and language servers are not available inside this package, and GDB debugging
  is not supported by this confined build.

license: GPL-3.0-or-later
contact: kanakprabhakar72@gmail.com
website: https://github.com/Kanak234/medha-ide
source-code: https://github.com/Kanak234/medha-ide
issues: https://github.com/Kanak234/medha-ide/issues
icon: snap/gui/io.github.Kanak234.Medha.png

base: core24
confinement: strict
grade: stable
# WHY: version comes from medha/__init__.py so the snap and the app never disagree.
adopt-info: medha-app

# WHY: amd64 only for the first release (smaller risk, faster build). Add arm64 later.
platforms:
  amd64:

parts:
  # Python runtime + pip deps. PySide6 wheels bundle their own Qt 6 libs and plugins,
  # so we do NOT stage apt Qt packages (mixing them causes version clashes).
  python-deps:
    plugin: python
    source: .
    # WHY: only the small pure deps here. PySide6 goes in its own part below, because
    # enable-patchelf (needed for this part's python) corrupts Qt plugin metadata
    # ("libqxcb.so is not a Qt plugin") and the app then cannot open a window.
    python-packages:
      - psutil>=7.2.0
      - requests>=2.34.0
    # WHY no enable-patchelf any more: that was only needed for classic. In a strict snap the
    # python plugin links $SNAP/bin/python3 to the staged python3.12 automatically.
    stage-packages:
      - libpython3.12-minimal
      - libpython3.12-stdlib
      - python3.12-minimal
      - python3.12-venv
      - python3-minimal
      # runtime libs the Qt xcb/wayland platform plugins load from the system
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xinerama0
      - libxcb-xkb1
      - libxkbcommon-x11-0
      - libegl1
      - libgl1
      - libfontconfig1
      - libdbus-1-3

  # PySide6 WITHOUT patchelf. The wheel's .so files already use $ORIGIN rpaths, so they
  # need no patching. Only PySide6-Essentials: MEDHA uses QtCore/QtGui/QtWidgets/QtNetwork
  # (checked by grepping imports), which keeps the snap ~3x smaller than full PySide6.
  # Installed with the build host python3.12 (same as core24) into the venv's site-packages.
  pyside6:
    plugin: nil
    after: [python-deps]
    build-packages:
      - python3-pip
    override-build: |
      # WHY /usr/bin/python3.12: inside a part, PATH starts with stage/usr/bin, and the staged
      # python has no pip. The build host python3.12 (Ubuntu 24.04 = core24, same ABI) does.
      /usr/bin/python3.12 -m pip install --no-compile --break-system-packages \
        --target "$CRAFT_PART_INSTALL/lib/python3.12/site-packages" \
        "PySide6-Essentials==6.12.0"
    stage:
      - lib/python3.12/site-packages

  # The real app source tree, so medha/ finds docs/assets/icon the same way as in the repo.
  medha-app:
    plugin: dump
    source: .
    organize:
      medha: app/medha
      docs/assets: app/docs/assets
      LICENSE: app/LICENSE
      examples: app/examples
    stage:
      - app/medha
      - app/examples
      - app/docs/assets
      - app/LICENSE
      - -app/medha/**/__pycache__
    override-pull: |
      craftctl default
      # WHERE: read __version__ = "x.y.z" from medha/__init__.py -> snap version
      VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' medha/__init__.py)
      craftctl set version="${VERSION:-1.1.0}"

  launcher:
    plugin: dump
    source: snap/local
    organize:
      launch-medha: bin/launch-medha
    stage:
      - bin/launch-medha
      - toolwrap

  # C / C++ compilers. WHY gcc-13: it is Ubuntu 24.04's default, same ABI as the core24 base,
  # so compiled student programs run against core24's glibc without surprises.
  # snapcraft also pulls every dependency (cc1, as, ld, libc6-dev headers, crt1.o ...).
  compilers:
    plugin: nil
    stage-packages:
      - gcc-13
      - g++-13
      - binutils
      - libc6-dev
      - libstdc++-13-dev
      - libstdc++6
      - make

  # GCC's sysroot needs the core24 libc linker targets. Only libc runtime
  # targets may point into the base. Bundle GCC/C++ runtimes, and omit gconv
  # module aliases (the running libc already loads those from the base).
  libc-links:
    plugin: nil
    # The Python venv must prime lib64 -> lib before these linker aliases.
    after: [compilers, python-deps]
    override-prime: |
      craftctl default
      for pkg in libc6 libgcc-s1 libstdc++6; do
        dpkg -L "$pkg" 2>/dev/null | grep -E '^/(usr/)?lib(64)?/.*\.so[.0-9]*$' | while read -r f; do
          case "$f" in */gconv/*) continue ;; esac
          if [ "$pkg" != libc6 ] && [ ! -e "$CRAFT_PRIME$f" ]; then
            mkdir -p "$(dirname "$CRAFT_PRIME$f")"
            cp -L "$f" "$CRAFT_PRIME$f"
          fi
          # Noble uses /usr/lib; glibc linker scripts also reference /lib.
          for t in "$f" "${f#/usr}"; do
            [ -e "$CRAFT_PRIME$t" ] || [ -L "$CRAFT_PRIME$t" ] && continue
            mkdir -p "$(dirname "$CRAFT_PRIME$t")"
            if [ "$pkg" = libc6 ]; then
              ln -s "$f" "$CRAFT_PRIME$t"
            else
              target=$(realpath --relative-to="$(dirname "$CRAFT_PRIME$t")" "$CRAFT_PRIME$f")
              ln -s "$target" "$CRAFT_PRIME$t"
            fi
          done
        done
      done

  # Java: Eclipse Temurin JDK 25 (same as the Windows MSIX). WHY a tarball and not the
  # openjdk deb: the deb's config files are absolute /etc symlinks set up by
  # update-alternatives, which never runs inside a snap. The Temurin tarball is self-contained.
  jdk:
    plugin: nil
    build-packages: [curl, ca-certificates]
    override-build: |
      curl -fsSL -o jdk.tar.gz "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse"
      mkdir -p "$CRAFT_PART_INSTALL/jdk"
      tar -xzf jdk.tar.gz -C "$CRAFT_PART_INSTALL/jdk" --strip-components=1
      # not needed at runtime: sources, man pages, demos (saves ~60 MB)
      rm -rf "$CRAFT_PART_INSTALL/jdk/lib/src.zip" "$CRAFT_PART_INSTALL/jdk/man" "$CRAFT_PART_INSTALL/jdk/demo"

  # AppStream metadata for software centres
  metainfo:
    plugin: dump
    source: packaging
    organize:
      io.github.Kanak234.Medha.metainfo.xml: usr/share/metainfo/io.github.Kanak234.Medha.metainfo.xml
    stage:
      - usr/share/metainfo/io.github.Kanak234.Medha.metainfo.xml

  # WHY: the app's `desktop:` path is resolved inside the built snap (prime), and meta/gui
  # does not exist yet at that point. So we ship the .desktop as a normal file in
  # usr/share/applications and point `desktop:` there. Icon= still uses ${SNAP}/meta/gui/,
  # because snapcraft copies snap/gui/*.png into meta/gui when it packs the snap.
  desktop-entry:
    plugin: dump
    source: snap/gui
    organize:
      io.github.Kanak234.Medha.desktop: usr/share/applications/io.github.Kanak234.Medha.desktop
    stage:
      - usr/share/applications/io.github.Kanak234.Medha.desktop

apps:
  medha-ide:
    command: bin/launch-medha
    desktop: usr/share/applications/io.github.Kanak234.Medha.desktop
    common-id: io.github.Kanak234.Medha
    # Standard desktop interfaces; removable-media may need a manual connection.
    plugs:
      - home              # open/save projects in your home folder
      - removable-media   # USB drives (lab PCs)
      - network           # Open VSX extensions, local Ollama
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - audio-playback    # Turbo C sound() beeps
