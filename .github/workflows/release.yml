name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the package before releasing
        run: |
          python3 -m compileall -q medha
          python3 -m py_compile medha/__main__.py build_packages.py

      - name: Build Production Bundle
        run: |
          tar -czf release-bundle.tar.gz --exclude='.git' --exclude='node_modules' .
          sha256sum release-bundle.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            release-bundle.tar.gz
            SHA256SUMS.txt
