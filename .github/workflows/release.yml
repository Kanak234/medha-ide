name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The application is the Python package medha/, run with
      # `python3 -m medha`. This job used to run `npm ci && npm run build`
      # first, which could never succeed: package.json's build is
      # `tsc && vite build`, and neither index.html nor vite.config.ts is at
      # the repository root -- both live in legacy/, where the superseded web
      # front-end was moved. vite exited with
      # "Could not resolve entry module index.html" every time.
      #
      # It also made no difference to the artifact. The tar below archives the
      # source tree and excludes node_modules, so nothing the build produced
      # was ever shipped. Pointing the build at legacy/ instead would have
      # revived a retired app to feed a step whose output is discarded, so the
      # step is removed rather than repaired.
      - name: Validate the package before releasing
        run: |
          python3 -m compileall -q medha
          python3 -m py_compile medha/__main__.py build_packages.py

      - name: Build Production Bundle
        run: |
          tar -czf release-bundle.tar.gz --exclude='.git' --exclude='node_modules' .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: release-bundle.tar.gz
