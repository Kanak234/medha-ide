<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- MEDHA IDE app icon (original design for Kanak Prabhakar).
       Idea: "Medha" = intellect. A flame of knowledge (deepak lau) held between code brackets < > . -->
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233F"/>
      <stop offset="1" stop-color="#070C1A"/>
    </linearGradient>
    <linearGradient id="br" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="0.55" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded-square tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="#5EEAD4" stroke-opacity="0.18" stroke-width="4"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sheen)"/>

  <!-- glow behind flame -->
  <circle cx="256" cy="262" r="150" fill="url(#glow)"/>

  <!-- code brackets -->
  <path d="M176 156 L92 256 L176 356" fill="none" stroke="url(#br)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M336 156 L420 256 L336 356" fill="none" stroke="url(#br)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- flame (lau) -->
  <path d="M256 138
           C286 186, 318 214, 318 262
           C318 300, 290 330, 256 330
           C222 330, 194 300, 194 262
           C194 226, 220 206, 232 178
           C240 204, 252 212, 262 214
           C262 190, 258 166, 256 138 Z"
        fill="url(#fl)"/>
  <!-- inner flame core -->
  <path d="M256 236 C272 256, 282 268, 282 286 C282 302, 270 314, 256 314 C242 314, 230 302, 230 286 C230 268, 244 258, 256 236 Z"
        fill="#FFF7E0" opacity="0.9"/>

  <!-- diya base -->
  <path d="M196 352 H316 Q312 384 256 388 Q200 384 196 352 Z" fill="#F59E0B"/>
  <rect x="186" y="342" width="140" height="14" rx="7" fill="#FCD34D"/>
</svg>
